name: Container image
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$app_version" || {
            echo "Release tag v$tag_version does not match package.json version $app_version"
            exit 1
          }

      # ---- Free a LOT of disk on the runner (10–30 GB) ----
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use a recent BuildKit with better compression and GC
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # ---- Build & push with stronger compression and GHA cache ----
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./container/Containerfile
          target: final
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # GHA cache helps avoid rebuilding toolchains repeatedly
          cache-from: type=gha,scope=standard
          cache-to: type=gha,mode=max,scope=standard
          # Use zstd compression -> smaller layers during export
          sbom: false
          provenance: false
          outputs: type=registry,compression=zstd,force-compression=true

      # Optional: final GC to keep the job lean
      - name: Final prune
        if: always()
        run: |
          docker buildx prune -af || true
          docker system prune -af --volumes || true
          df -h

  build-cuda:
    name: Build CUDA image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$app_version" || {
            echo "Release tag v$tag_version does not match package.json version $app_version"
            exit 1
          }

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract CUDA image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            suffix=-cuda,onlatest=true

      - name: Build and push CUDA Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./container/Containerfile
          target: cuda
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=max,scope=cuda
          sbom: false
          provenance: false
          outputs: type=registry,compression=zstd,force-compression=true

      - name: Final prune
        if: always()
        run: |
          docker buildx prune -af || true
          docker system prune -af --volumes || true
          df -h
